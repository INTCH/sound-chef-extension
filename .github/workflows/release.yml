name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches manifest version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm test

      - name: Package
        run: node scripts/build.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/sound-chef-${VERSION}.zip" \
            --title "Sound Chef ${VERSION}" \
            --notes "Unzip **sound-chef-${VERSION}.zip** and load the folder in chrome://extensions with Developer mode on (Load unpacked); see the README."
